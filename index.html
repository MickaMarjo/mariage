<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Mariage</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

.page{
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    transition:opacity 0.8s ease;
}

.background{
    display:none;
}

.hidden{
    opacity:0;
    pointer-events:none;
}

img{
    width:100%;
    height:100%;
    object-fit:cover;
    cursor:pointer;
}

@media (min-width:768px){

    .page{
        overflow:hidden;
    }

    .background{
        display:block;
        position:absolute;
        top:-30px;
        right:-30px;
        bottom:-30px;
        left:-30px;

        background-size:cover;
        background-position:center;

        filter:blur(25px);
        transform:scale(1.1);

        opacity:0.6;
        z-index:0;
        pointer-events:none;
    }

    img{
        position:relative;
        object-fit:contain;
        z-index:1;
    }

    .message{
        z-index:2;
    }
}

.message{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.5);
    color:white;
    padding:12px 20px;
    border-radius:25px;
    font-size:18px;
}
</style>
</head>

<body>

<div id="page1" class="page">
    <div class="background" style="background-image:url('photo1.jpg');"></div>
    <img src="photo1.jpg" alt="Photo 1" onclick="showPhoto2()">
    <div class="message">❤️ Touchez la photo</div>
</div>

<div id="page2" class="page hidden">
    <div class="background" style="background-image:url('photo2.jpg');"></div>
    <img src="photo2.jpg" alt="Photo 2" onclick="goToWeddingSite()">
    <div class="message">💍 Découvrez notre mariage</div>
</div>

<script>
function showPhoto2(){
    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.remove("hidden");
}

function goToWeddingSite(){
    window.location.href = "https://withjoy.com/votre-mariage";
}
</script>

</body>
</html>
