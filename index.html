<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notre Mariage</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
        }

        /* Chaque page occupe tout l'écran */
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            background: black;
            opacity: 1;
            transition: opacity 0.8s ease;
        }

        /* Page masquée */
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Image utilisée comme fond flouté */
        .background {
            position: absolute;
            inset: -30px;
            background-size: cover;
            background-position: center;
            filter: blur(25px);
            transform: scale(1.1);
            opacity: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Photo principale */
        .photo {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            cursor: pointer;
            z-index: 1;
        }

        /* Message en bas */
        .message {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 18px;
            white-space: nowrap;
            z-index: 2;

            /* Le message ne bloque jamais le clic */
            pointer-events: none;
        }

        /* ====================================
           TABLETTE / ORDINATEUR
           ==================================== */

        @media (min-width: 768px) {

            /* Fond flouté visible */
            .background {
                opacity: 0.55;
            }

            /* La photo principale est affichée entièrement */
            .photo {
                object-fit: contain;
            }

        }

    </style>
</head>


<body>


    <!-- ====================================
         PAGE 1
         ==================================== -->

    <div id="page1" class="page">

        <!-- Fond flouté -->
        <div
            class="background"
            style="background-image: url('photo1.jpg');">
        </div>

        <!-- PHOTO 1 CLIQUABLE -->
        <img
            src="photo1.jpg"
            class="photo"
            alt="Photo 1"
            onclick="showPhoto2()"
        >

        <div class="message">
            ❤️ Touchez la photo
        </div>

    </div>


    <!-- ====================================
         PAGE 2
         ==================================== -->

    <div id="page2" class="page hidden">

        <!-- Fond flouté -->
        <div
            class="background"
            style="background-image: url('photo2.jpg');">
        </div>

        <!-- PHOTO 2 CLIQUABLE -->
   script>

        function showPhoto2() {
            document.getElementById("page1").classList.add("hidden");
            document.getElementById("page2").classList.remove("hidden");
        }


        function goToWeddingSite() {
            window.location.href = "https://withjoy.com/votre-mariage";
        }

    </script>


</body>

</html>
