<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notre Mariage</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;
            background: #000;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: opacity 0.8s ease;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .message {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 18px;
            backdrop-filter: blur(4px);
            text-align: center;
        }

        .heart {
            font-size: 22px;
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <!-- PHOTO 1 -->
    <div id="page1" class="page">
        photo1.jpg">

        <div class="message">
            <span class="heart">❤️</span>
            Touchez la photo
        </div>
    </div>

    <!-- PHOTO 2 -->
    <div id="page2" class="page hidden">
        photo2.jpg">

        <div class="message">
            <span class="heart">💍</span>
            Découvrez notre mariage
        </div>
    </div>

    <script>
        function showPhoto2() {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
        }

        function goToWeddingSite() {
            window.location.href = "https://withjoy.com/votre-mariage";
        }
    </script>

</body>

</html>
