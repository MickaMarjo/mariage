<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notre Mariage</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.8s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Photo principale */
        .photo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            cursor: pointer;
        }

        /* Message affiché en bas */
        .message {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 18px;
            white-space: nowrap;

            /* Important : le message ne bloque pas le clic */
            pointer-events: none;
        }

        /*
        =====================================
        ORDINATEUR / ÉCRAN LARGE
        =====================================
        */

        @media (min-width: 768px) {
            .photo {
                object-fit: contain;
            }
        }
    </style>
</head>

<body>

    <!-- ============================= -->
    <!-- PAGE 1 -->
    <!-- ============================= -->

    <div id="page1" class="page">

        <img
            class="photo"
            src="photo1.jpg"
            alt="Photo 1"
            onclick="showPhoto2()"
        >

        <div class="message">
            ❤️ Touchez la photo
        </div>

    </div>


    <!-- ============================= -->
    <!-- PAGE 2 -->
    <!-- ============================= -->

    <div id="page2" class="page hidden">

        <img
            class="photo"
            src="photo2.jpg"
            alt="Photo 2"
            onclick="goToWeddingSite()"
        >

        <div class="message">
            💍 Découvrez notre mariage
        </div>

    </div>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script>
        functiontps://withjoy.com/votre-mariage";
        }
    </script>

</body>

</html>
